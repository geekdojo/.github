name: secret-scan

# This repository's own caller for the reusable gitleaks gate
# (geekdojo/geekdojo-brain#105). Every other public repository calls it as
# `.github/workflows/gitleaks.yml`; here that path IS the reusable workflow, so
# the caller lives under a different file name. The job id is still `gitleaks`,
# so the check reads `gitleaks / scan` here exactly as it does everywhere else.
#
# It calls the reusable workflow at `@main`, NOT through a local `./` path. A
# local path would run a pull request's OWN edited copy of gitleaks.yml, so a PR
# could weaken the scan or delete the step that warns about gate changes and be
# checked by its own weakened version. `@main` means the merged, reviewed
# version inspects every change to it. The cost: a PR that edits gitleaks.yml
# is not exercised by its own run here; test such a change from a throwaway
# caller pinned to the branch commit before merging.

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    permissions:
      contents: read
    uses: geekdojo/.github/.github/workflows/gitleaks.yml@main
