name: gitleaks

# Reusable secret-scanning gate for every public geekdojo repository
# (geekdojo/geekdojo-brain#105). A caller adds a two-line job:
#
#   jobs:
#     gitleaks:
#       uses: geekdojo/.github/.github/workflows/gitleaks.yml@<ref>
#
# and the check appears on its pull requests as `gitleaks / scan`. Both job ids
# (the caller's `gitleaks`, this file's `scan`) are what branch protection
# requires, so neither job gets a `name:` and neither id should be renamed.
#
# WHAT IT SCANS: the caller's FULL history on every fetched ref, not just the
# pull request's diff. A secret that landed years ago in a public repository is
# still public, and a diff-only scan would never see it again.
#
# WHAT SILENCES A FINDING: only a fingerprint in the caller's `.gitleaksignore`,
# each preceded by a `#` comment giving the reason. No rule is disabled and no
# path is excluded, vendored code included. Treat a change to `.gitleaksignore`
# in review as what it is: a request to stop looking at something.
#
# WHY NOT gitleaks/gitleaks-action: it needs a paid licence for organisation
# repositories. The binary is the same scanner, so this installs the release
# directly and verifies it before running it.

on:
  workflow_call:

# Empty here; the job asks for what it needs. The scan reads the repository and
# writes nothing, so a total compromise of this job yields a failed check.
permissions: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.30.1"
      # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz. The download is checked
      # against the release's own checksums file AND against this pin: the
      # checksums file only proves the tarball matches what the release page
      # says today, and this pin proves it is still the tarball we reviewed.
      # Bump both together.
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: gitleaks walks every commit on every fetched ref.
          fetch-depth: 0
          persist-credentials: false

      - name: warn when the pull request changes the secret-scan gate
        # A pull request can weaken this gate from the inside: add a fingerprint
        # to .gitleaksignore to silence its own finding, or edit the workflows
        # that run the scan. The scan cannot judge that, so this step makes it
        # loud for the reviewer: a warning annotation per changed file and a
        # step-summary section listing each added fingerprint under its reason.
        #
        # It never fails the job (warning, not gate) and needs nothing beyond
        # contents: read. It runs before the install and scan steps so the
        # warning is there even when the scan fails.
        #
        # Untrusted text never reaches stdout, where a line could be read as a
        # workflow command: annotations name only the fixed paths below, and the
        # file's contents go to the step summary, HTML-escaped, inside <pre>.
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"

          # Three dots: what the pull request's own commits change since it
          # branched, not what main gained in the meantime. --no-renames lists
          # a renamed-away gate file under its old path too.
          if ! changed=$(git diff --no-renames --name-only "${BASE_SHA}...${HEAD_SHA}" 2>/dev/null); then
            echo "::warning title=Secret-scan gate not checked::Could not diff this pull request's base against its head, so changes to .gitleaksignore and the gitleaks workflows were not checked. Review them by hand."
            exit 0
          fi

          hits=""
          for path in .gitleaksignore .github/workflows/gitleaks.yml .github/workflows/secret-scan.yml; do
            if printf '%s\n' "$changed" | grep -qxF "$path"; then
              hits="${hits} ${path}"
              echo "::warning file=${path},title=Secret-scan gate changed::This PR changes ${path}, part of the secret-scan gate. Review before merging."
            fi
          done

          if [ -z "$hits" ]; then
            echo "This pull request does not change the secret-scan gate."
            exit 0
          fi

          {
            echo "## ⚠️ This PR changes the secret-scan gate — review before merging"
            echo
            echo "These files decide what the gitleaks check reports. A change to them can silence or weaken it:"
            echo
            for path in $hits; do echo "- \`${path}\`"; done
            echo
          } >> "$summary"

          case " ${hits} " in
            *" .gitleaksignore "*) ;;
            *) exit 0 ;;
          esac

          added="${RUNNER_TEMP}/gitleaksignore-added"
          head_file="${RUNNER_TEMP}/gitleaksignore-head"
          git diff --no-renames --unified=0 "${BASE_SHA}...${HEAD_SHA}" -- .gitleaksignore 2>/dev/null \
            | awk '/^\+\+\+/ { next } /^\+/ { l = substr($0, 2); if (l !~ /^[ \t]*#/ && l ~ /[^ \t]/) print l }' > "$added"
          git show "${HEAD_SHA}:.gitleaksignore" > "$head_file" 2>/dev/null

          {
            echo "### Fingerprints added to \`.gitleaksignore\`"
            echo
            if [ -s "$added" ]; then
              echo "Each fingerprint is shown under the \`#\` comment above it in the pull request's version of the file. Secret values are never part of a fingerprint."
              echo
              echo "<pre>"
              # Each added fingerprint with the comment block directly above it.
              awk '
                NR == FNR { add[$0] = 1; next }
                /^[ \t]*#/ { buf = buf $0 "\n"; next }
                /^[ \t]*$/ { buf = ""; next }
                {
                  if ($0 in add) {
                    if (buf == "") buf = "# (no reason comment)\n"
                    printf "%s%s\n\n", buf, $0
                    delete add[$0]
                  }
                  buf = ""
                }
              ' "$added" "$head_file" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'
              echo "</pre>"
            else
              echo "None. The change removes or rewords entries only."
            fi
          } >> "$summary"
          exit 0

      - name: install gitleaks (checksum-verified)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          sums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          dir="${RUNNER_TEMP}/gitleaks"
          mkdir -p "$dir"
          cd "$dir"
          curl -sSfL --retry 3 -o "$tarball" "${base}/${tarball}"
          curl -sSfL --retry 3 -o "$sums" "${base}/${sums}"

          published=$(awk -v f="$tarball" '$2 == f { print $1 }' "$sums")
          actual=$(sha256sum "$tarball" | awk '{ print $1 }')
          if [ -z "$published" ]; then
            echo "::error::${tarball} is not listed in ${sums}"
            exit 1
          fi
          if [ "$actual" != "$published" ]; then
            echo "::error::${tarball} SHA-256 ${actual} does not match ${sums} (${published})"
            exit 1
          fi
          if [ "$actual" != "$GITLEAKS_SHA256" ]; then
            echo "::error::${tarball} SHA-256 ${actual} does not match the pinned ${GITLEAKS_SHA256}"
            exit 1
          fi

          tar -xzf "$tarball" gitleaks
          ./gitleaks version

      - name: scan full history
        # --redact keeps secret values out of the job log; findings still name
        # the rule, file, line, commit and fingerprint, which is all a
        # .gitleaksignore entry needs. gitleaks reads .gitleaksignore from the
        # scanned directory, so the caller's file is honoured without a flag.
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/gitleaks/gitleaks" git . --redact --verbose --no-banner --exit-code 1
